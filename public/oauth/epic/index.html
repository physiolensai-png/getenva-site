<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enva</title>
  <meta name="description" content="Enva — health intelligence.">
  <meta name="theme-color" content="#0E0E0E">
  <meta name="robots" content="noindex">

  <link rel="preload" href="/fonts/EnvaSans-Light.woff2" as="font"
        type="font/woff2" crossorigin>

  <style>
    @font-face {
      font-family: 'Enva Sans';
      font-style: normal;
      font-weight: 300;
      font-display: swap;
      src: url('/fonts/EnvaSans-Light.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Enva Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/fonts/EnvaSans-Regular.woff2') format('woff2');
    }
    :root {
      --ground: #0E0E0E;
      --ink: #F2EFE9;
      --muted: #8A8279;
      --accent: #E4652A;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Enva Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 32px;
      background: var(--ground);
      color: var(--ink);
      text-align: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    h1 {
      font-size: clamp(56px, 15vw, 104px);
      font-weight: 300;
      letter-spacing: 0.005em;
      line-height: 1;
      margin: 0;
    }

    p {
      font-size: clamp(15px, 3.6vw, 17px);
      font-weight: 400;
      line-height: 1.6;
      color: var(--muted);
      max-width: 30ch;
      margin: 22px auto 0;
    }

    .rule {
      width: 34px;
      height: 2px;
      background: var(--accent);
      border: 0;
      margin: 30px auto 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Enva</h1>
    <p>Open this link on your iPhone with Enva installed.</p>
    <hr class="rule">
  </main>
</body>
</html>
